      bg: accent, text: '#0B0B0C', muted: 'rgba(11,11,12,0.72)', line: 'rgba(11,11,12,0.18)', border: 'none',
      badgeBg: '#0B0B0C', badgeText: accent, btnBg: '#0B0B0C', btnText: '#F4F1EA'
    } : fm === 'Oscura con borde' ? {
      bg: light ? '#141413' : t.card, text: '#F4F1EA', muted: '#A8A39A', line: 'rgba(255,255,255,0.12)', border: '2px solid ' + accent,
      badgeBg: accent, badgeText: '#0B0B0C', btnBg: accent, btnText: '#0B0B0C'
    } : {
      bg: light ? '#FFFFFF' : '#F3EEE4', text: '#141413', muted: '#5C5850', line: 'rgba(20,20,19,0.14)', border: light ? '1px solid rgba(20,20,19,0.12)' : 'none',
      badgeBg: '#141413', badgeText: accent, btnBg: '#141413', btnText: '#F3EEE4'
    };

    const open = this.state.open;
    const faqData = [
      { title: 'Contenido auténtico', text: 'Creo contenido de valor dentro del mundo del entrenamiento y el cuidado personal, conectando con mi audiencia desde la experiencia y la constancia.' },
      { title: 'Resultados reales', text: 'Un enfoque 1:1 orientado a resultados sostenibles y a un cambio integral en cada persona, presencial u online.' },
      { title: 'Audiencia real', text: '74.565 cuentas alcanzadas y 7.441 interacciones en los últimos 90 días. Ayudo a marcas a conectar con una comunidad que realmente participa.' },
      { title: 'Crecimiento orgánico', text: 'El 47,4% de los espectadores todavía no me sigue: un alcance que llega más allá de la comunidad, sin atajos.' }
    ];
    const faq = faqData.map((q, i) => ({
      ...q,
      num: '0' + (i + 1),
      open: open === i,
      expanded: open === i ? 'true' : 'false',
      rot: open === i ? 'rotate(180deg)' : 'rotate(0deg)',
      bg: open === i ? t.card2 : t.card,
      toggle: () => this.setState({ open: open === i ? -1 : i })
    }));

    const sMode = p.tarjetasServicios ?? 'Foto con degradado';
    const services = [
      { img: 'img/edu-full.jpg', pos: 'center 30%', tag: 'PRESENCIAL', title: 'Entrenamiento personalizado', text: 'Sesiones 1:1 en el gimnasio, con técnica, progresión y seguimiento.' },
      { img: 'img/edu-sonrisa.jpg', pos: 'center 25%', tag: 'ONLINE', title: 'Coaching online 1:1', text: 'Tu plan y acompañamiento a distancia, estés donde estés.' },
      { img: 'img/edu-flex.jpg', pos: 'center 20%', tag: 'MARCAS', title: 'Contenido para marcas', text: 'Reels e historias auténticas que conectan con una audiencia real.' },
      { img: 'img/edu-pose.jpg', pos: 'center 20%', tag: 'LIFESTYLE', title: 'Fitness y lifestyle', text: 'Constancia, cuidado personal y transformación física real.' }
    ].map((s, i) => ({
      ...s, n: '0' + (i + 1),
      grad: sMode === 'Foto con degradado', top: sMode === 'Foto arriba', num: sMode === 'Número grande'
    }));

    return { accent, t, f, hero, ctaGlow, band, r, d, plans, wa, feat, faq, services, showCoaching, showWatermark: p.marcaAgua ?? true };
  }
}

</script>
<script>
const SPEC = JSON.parse(document.getElementById('props').textContent);
const props = {};
Object.keys(SPEC).forEach(k => { if (k[0] !== '$') props[k] = SPEC[k].default; });
const comp = new Component(props);
const TPL = document.getElementById('tpl');
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function proc(node, scope){
  if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = look(node.getAttribute('list').replace(/[{}]/g, ''), scope) || [];
    const as = node.getAttribute('as') || 'item';
    const frag = document.createDocumentFragment();
    list.forEach((it, i) => {
      const s = Object.assign(Object.create(scope), { [as]: it, $index: i });
      Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); frag.appendChild(cl); proc(cl, s); });
    });
    node.replaceWith(frag); return;
  }
  if (tag === 'sc-if') {
    const v = look(node.getAttribute('value').replace(/[{}]/g, ''), scope);
    if (!v) { node.remove(); return; }
    const kids = Array.from(node.childNodes); node.replaceWith(...kids); kids.forEach(k => proc(k, scope)); return;
  }
  Array.from(node.attributes).forEach(a => {
    if (!a.value.includes('{{')) return;
    if (/^on[A-Z]/.test(a.name) || /^on[a-z]+$/.test(a.name) && a.value.trim().startsWith('{{')) {
      const fn = look(a.value.replace(/[{}]/g, ''), scope); node.removeAttribute(a.name);
      if (typeof fn === 'function') node.addEventListener(a.name.slice(2).toLowerCase(), fn); return;
    }
    node.setAttribute(a.name, interp(a.value, scope));
  });
  Array.from(node.childNodes).forEach(c => proc(c, scope));
}
function rerender(){
  const vals = comp.renderVals();
  const frag = TPL.content.cloneNode(true);
  Array.from(frag.childNodes).forEach(c => proc(c, vals));
  const app = document.getElementById('app'); app.replaceChildren(frag);
}
function buildPanel(){
  const body = document.getElementById('pbody'); let sec = null;
  Object.keys(SPEC).forEach(k => {
    if (k[0] === '$') return; const s = SPEC[k];
    if (s.section && s.section !== sec) { sec = s.section; const h = document.createElement('h4'); h.textContent = sec; body.appendChild(h); }
    const lab = document.createElement('label');
    const name = k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
    const title = document.createElement('span'); title.textContent = name; lab.appendChild(title);
    const set = v => { props[k] = v; comp.props = props; rerender(); };
    if (s.editor === 'enum') {
      const sel = document.createElement('select'); s.options.forEach(o => { const op = document.createElement('option'); op.textContent = o; sel.appendChild(op); });
      sel.value = s.default; sel.onchange = () => set(sel.value); lab.appendChild(sel);
    } else if (s.editor === 'range') {
      const val = document.createElement('span'); val.className = 'val'; title.append(' '); title.appendChild(val);
      const r = document.createElement('input'); r.type = 'range'; r.min = s.min; r.max = s.max; r.step = s.step || 1; r.value = s.default;
      const show = () => val.textContent = r.value + (s.unit || (s.max <= 2 ? '×' : '')); show();
      r.oninput = () => { show(); set(Number(r.value)); }; lab.appendChild(r);
    } else if (s.editor === 'text') {
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = s.default || ''; inp.placeholder = 'Ej: 595981123456'; inp.style.cssText = 'padding:7px 8px;border-radius:8px;border:1px solid rgba(20,20,19,.2);font:inherit'; inp.oninput = () => set(inp.value); lab.appendChild(inp);
    } else if (s.editor === 'boolean') {
      lab.className = 'row'; const c = document.createElement('input'); c.type = 'checkbox'; c.checked = s.default; c.onchange = () => set(c.checked); lab.appendChild(c);
    } else if (s.editor === 'color') {
      const w = document.createElement('div'); w.className = 'sw';
      const btns = (s.options || []).map(o => { const b = document.createElement('button'); b.type = 'button'; b.style.background = o; b.setAttribute('aria-label', o); b.onclick = () => { pick(o); }; w.appendChild(b); return [o, b]; });
      const ci = document.createElement('input'); ci.type = 'color'; ci.value = s.default; ci.oninput = () => pick(ci.value); ci.setAttribute('aria-label', 'Color personalizado'); w.appendChild(ci);
      const pick = o => { btns.forEach(([v, b]) => b.setAttribute('aria-pressed', String(v === o))); ci.value = o; set(o); };
      btns.forEach(([v, b]) => b.setAttribute('aria-pressed', String(v === s.default)));
      lab.appendChild(w);
    }
    body.appendChild(lab);
  });
  document.getElementById('pmin').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'Mostrar' : 'Ocultar'; };
}
rerender();
</script>
